name: 🚀 SUPABASE TO AZURE INJECTION

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "MIGRATE" to confirm'
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  migrate:
    if: github.event.inputs.confirm == 'MIGRATE'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR Credentials
        id: acr
        run: |
          RESOURCE_GROUP="rg-kiddo"
          ACR_NAME=$(az acr list --resource-group $RESOURCE_GROUP --query "[0].name" -o tsv)
          ACR_SERVER=$(az acr show --name $ACR_NAME --query loginServer -o tsv)
          echo "name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "server=$ACR_SERVER" >> $GITHUB_OUTPUT

      - name: Build and Push Migration Image
        run: |
          az acr login --name ${{ steps.acr.outputs.name }}
          docker build -t ${{ steps.acr.outputs.server }}/migration-job:${{ github.sha }} -f server/migration.Dockerfile .
          docker push ${{ steps.acr.outputs.server }}/migration-job:${{ github.sha }}

      - name: Get Infrastructure Details
        id: infra
        run: |
          RESOURCE_GROUP="rg-kiddo"
          VNET_NAME=$(az network vnet list --resource-group $RESOURCE_GROUP --query "[0].name" -o tsv)
          SUBNET_ID=$(az network vnet subnet show --resource-group $RESOURCE_GROUP --vnet-name $VNET_NAME --name snet-app --query id -o tsv)
          DB_HOST=$(az postgres flexible-server list --resource-group $RESOURCE_GROUP --query "[0].fullyQualifiedDomainName" -o tsv)
          echo "subnet_id=$SUBNET_ID" >> $GITHUB_OUTPUT
          echo "db_host=$DB_HOST" >> $GITHUB_OUTPUT

      - name: Execute Migration Job
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: rg-kiddo
          template: ./infra/migration-job.bicep
          deploymentName: 'migrate-${{ github.sha }}'
          parameters: >
            location=centralus 
            subnetId=${{ steps.infra.outputs.subnet_id }} 
            dbHost=${{ steps.infra.outputs.db_host }} 
            dbUser=kiddomin 
            dbPassword=${{ secrets.DB_PASSWORD }} 
            migrationImage=${{ steps.acr.outputs.server }}/migration-job:${{ github.sha }}
